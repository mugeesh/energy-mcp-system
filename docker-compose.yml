name: iam-mcp

# Both services share one image; only the command/working directory differ.
x-app: &app
  build:
    context: ./mcp-server-client
  image: iam-mcp-app:latest
  restart: unless-stopped

services:
  mcp-server:
    <<: *app
    command: ["uv", "run", "python", "server.py"]
    working_dir: /app/mcp_server
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8001"
      MCP_HTTP_PATH: /mcp
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      IAM_URL: ${IAM_URL:-https://iam.staging.energybox.com}
      IAM_API_PREFIX: ${IAM_API_PREFIX:-/api/v1}
      ts_api_url: ${ts_api_url:-}
    # Loopback-only by default; the client reaches it over the compose network.
    ports:
      - "127.0.0.1:${MCP_SERVER_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  mcp-client:
    <<: *app
    command:
      - uv
      - run
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    working_dir: /app
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_SERVER_URL: http://mcp-server:8001/mcp
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TEMPERATURE: ${DEEPSEEK_TEMPERATURE:-0.2}
      IAM_URL: ${IAM_URL:-https://iam.staging.energybox.com}
      IAM_API_PREFIX: ${IAM_API_PREFIX:-/api/v1}
      ts_api_url: ${ts_api_url:-}
      MCP_MAX_HISTORY: ${MCP_MAX_HISTORY:-12}
      MCP_MAX_STEPS: ${MCP_MAX_STEPS:-8}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

